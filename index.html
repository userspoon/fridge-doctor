<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Холодильник Доктор — ассистент диагностики</title>
<style>
  :root{
    --bg1:#0f2027; --bg2:#203a43; --bg3:#2c5364;
    --card:#ffffff; --ink:#1d2b36; --muted:#5d7285;
    --blue:#1f7ae0; --blue-dark:#155bb0;
    --green:#1e9e5a; --amber:#e08a00; --red:#d9363e;
    --chip:#eaf3fd;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    color:var(--ink);
  }
  .app{
    max-width:880px; margin:0 auto; height:100vh; height:100dvh;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; flex-wrap:wrap;
  }
  .logo{color:#fff; font-size:20px; font-weight:700; letter-spacing:.3px}
  .logo span{color:#8fd0ff}
  nav{display:flex; gap:8px; flex-wrap:wrap}
  nav button{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25);
    border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; transition:.15s;
    font-family:inherit;
  }
  nav button:hover{background:rgba(255,255,255,.25)}
  main{flex:1; overflow-y:auto; padding:6px 14px 18px; scroll-behavior:smooth}
  main::-webkit-scrollbar{width:8px}
  main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:4px}

  .row{display:flex; margin:10px 0; align-items:flex-end}
  .row.user{justify-content:flex-end}
  .ava{
    width:36px;height:36px;border-radius:50%;flex:0 0 36px;
    background:linear-gradient(135deg,#4aa3f0,#1f6fd0);
    display:flex;align-items:center;justify-content:center;font-size:19px;
    margin-right:8px; box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .bubble{
    background:var(--card); border-radius:14px 14px 14px 4px;
    padding:12px 14px; max-width:82%; box-shadow:0 2px 10px rgba(0,0,0,.25);
    font-size:15px; line-height:1.5; word-wrap:break-word;
  }
  .row.user .bubble{
    background:linear-gradient(135deg,#2b8aee,#1f6fd0); color:#fff;
    border-radius:14px 14px 4px 14px;
  }
  .bubble .q{font-weight:600; margin-bottom:4px}
  .bubble .hint{
    font-size:13px; color:var(--muted); background:#f2f6fa;
    border-left:3px solid var(--blue); padding:8px 10px; border-radius:6px; margin-top:8px;
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .askform{display:flex; gap:8px; margin-top:10px}
  .askform input{
    flex:1; min-width:140px; border:1.5px solid var(--blue); border-radius:10px;
    padding:9px 12px; font-size:14px; font-family:inherit; outline:none;
  }
  .chip{
    background:var(--chip); color:var(--blue-dark); border:1.5px solid var(--blue);
    border-radius:20px; padding:8px 14px; font-size:14px; cursor:pointer; transition:.12s;
    font-family:inherit;
  }
  .chip:hover{background:var(--blue); color:#fff}
  .chip:disabled{opacity:.45; cursor:default}
  .chip.small{padding:5px 11px; font-size:13px}

  .typing{display:inline-flex; gap:5px; padding:6px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#9db6c9;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* карточки причин */
  .cause{
    background:#fff; border-radius:12px; margin-top:10px; overflow:hidden;
    border:1px solid #e3eaf1; box-shadow:0 1px 5px rgba(0,0,0,.08);
  }
  .cause summary{
    list-style:none; cursor:pointer; padding:11px 13px; display:flex; gap:9px; align-items:center; flex-wrap:wrap;
    font-weight:600; font-size:14.5px;
  }
  .cause summary::-webkit-details-marker{display:none}
  .cause summary .arr{margin-left:auto; color:var(--muted); transition:.15s; font-size:12px}
  .cause[open] summary .arr{transform:rotate(180deg)}
  .badge{
    font-size:11.5px; font-weight:700; border-radius:12px; padding:3px 9px; white-space:nowrap;
  }
  .b-high{background:#e2f6ea; color:var(--green)}
  .b-mid{background:#fdf0d9; color:var(--amber)}
  .b-low{background:#eef1f4; color:var(--muted)}
  .b-lvl1{background:#e8f1fd; color:var(--blue-dark)}
  .b-lvl2{background:#e0f4f1; color:#0e8a76}
  .b-lvl3{background:#efe9fb; color:#6b46c1}
  .cause .body{padding:2px 14px 13px; font-size:14px; line-height:1.55}
  .cause .body h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:11px 0 5px}
  .cause .body ul,.cause .body ol{padding-left:20px}
  .cause .body li{margin:3px 0}
  .cause .note{
    background:#f2f6fa; border-radius:8px; padding:8px 10px; margin-top:9px; font-size:13.5px; color:#33475a;
  }
  .cause .warnbox{
    background:#fdeaea; border-left:3px solid var(--red); border-radius:6px;
    padding:8px 10px; margin-top:9px; font-size:13.5px; color:#8f2226;
  }
  .res-intro{
    background:#fff; border-radius:12px; padding:12px 14px; margin-top:10px;
    border-left:4px solid var(--blue); box-shadow:0 1px 5px rgba(0,0,0,.08); font-size:14.5px;
  }
  .summary-box{
    background:#0e2233; color:#d7e7f5; border-radius:12px; padding:13px 15px; margin-top:10px;
    font-family:Consolas, "Courier New", monospace; font-size:13px; white-space:pre-wrap; line-height:1.55;
  }

  footer{
    display:flex; gap:9px; padding:10px 14px 14px;
  }
  footer input{
    flex:1; border:none; border-radius:12px; padding:12px 16px; font-size:15px;
    outline:none; font-family:inherit; box-shadow:0 3px 12px rgba(0,0,0,.3);
  }
  footer button{
    border:none; border-radius:12px; background:var(--blue); color:#fff; font-size:17px;
    width:48px; cursor:pointer; transition:.15s; box-shadow:0 3px 12px rgba(0,0,0,.3);
  }
  footer button:hover{background:var(--blue-dark)}
  .foot-note{color:rgba(255,255,255,.45); text-align:center; font-size:11.5px; padding-bottom:9px}

  .ref h3{margin:14px 0 6px; font-size:15.5px}
  .ref .card{background:#fff; border-radius:12px; padding:12px 14px; margin-top:8px; box-shadow:0 1px 5px rgba(0,0,0,.08); font-size:14px}
  .ref table{border-collapse:collapse; width:100%; font-size:13.5px}
  .ref th,.ref td{border:1px solid #dfe7ee; padding:6px 8px; text-align:left; vertical-align:top}
  .ref th{background:#f0f6fc}
  @media (max-width:640px){
    .bubble{max-width:92%}
    header{justify-content:center}
  }

  /* ================== РЕДАКТОР БАЗЫ ЗНАНИЙ ================== */
  #editor{
    position:fixed; inset:0; z-index:50; background:#eef2f7; display:none;
    flex-direction:column; color:var(--ink);
  }
  #editor.open{display:flex}
  .ed-head{
    background:linear-gradient(135deg,var(--bg1),var(--bg2)); color:#fff;
    padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .ed-head .title{font-weight:700; font-size:16px}
  .ed-back{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff;
    border-radius:9px; padding:7px 12px; cursor:pointer; font-family:inherit; font-size:13px;
  }
  .ed-tabs{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
  .ed-tabs button{
    background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.25);
    border-radius:9px; padding:7px 13px; cursor:pointer; font-family:inherit; font-size:13px;
  }
  .ed-tabs button.active{background:#fff; color:var(--bg2); font-weight:700}
  .ed-body{flex:1; overflow-y:auto; padding:16px}
  .ed-wrap{max-width:980px; margin:0 auto}
  .ed-toolbar{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; align-items:center}
  .ed-toolbar input[type=text]{
    flex:1; min-width:200px; border:1px solid #c9d6e2; border-radius:9px; padding:9px 12px;
    font-size:14px; font-family:inherit; outline:none;
  }
  .btn{
    border:none; border-radius:9px; padding:9px 14px; font-size:13.5px; cursor:pointer;
    font-family:inherit; background:var(--blue); color:#fff; transition:.12s;
  }
  .btn:hover{background:var(--blue-dark)}
  .btn.green{background:var(--green)} .btn.green:hover{background:#178a4d}
  .btn.gray{background:#64778a} .btn.gray:hover{background:#51616f}
  .btn.red{background:var(--red)} .btn.red:hover{background:#b52b32}
  .btn.small{padding:5px 10px; font-size:12.5px}
  .ed-card{
    background:#fff; border:1px solid #dfe7ee; border-radius:12px; padding:13px 15px; margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .ed-item{
    background:#fff; border:1px solid #dfe7ee; border-radius:11px; padding:11px 13px; margin-bottom:8px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .ed-item .name{font-weight:600; font-size:14px; flex:1; min-width:200px}
  .ed-item .idm{font-size:11px; color:var(--muted); font-family:Consolas,monospace}
  .ed-form label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin:10px 0 4px}
  .ed-form input[type=text],.ed-form select,.ed-form textarea{
    width:100%; border:1px solid #c9d6e2; border-radius:8px; padding:8px 11px;
    font-size:14px; font-family:inherit; outline:none; background:#fff;
  }
  .ed-form textarea{min-height:74px; resize:vertical; line-height:1.45}
  .ed-form .frow{display:flex; gap:10px; flex-wrap:wrap}
  .ed-form .frow > div{flex:1; min-width:170px}
  .ed-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
  .opt-row{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    background:#f6f9fc; border:1px solid #e3eaf1; border-radius:9px; padding:8px 10px; margin-top:7px;
  }
  .opt-row input[type=text],.opt-row select{
    border:1px solid #c9d6e2; border-radius:7px; padding:6px 9px; font-size:13px; font-family:inherit; outline:none;
  }
  .opt-row .otext{flex:2; min-width:200px}
  .opt-row .oans{flex:1; min-width:140px}
  .node-block{border:1px solid #d7e1ea; border-radius:11px; margin-bottom:10px; background:#fff; overflow:hidden}
  .node-block > .nb-head{
    padding:10px 13px; background:#f0f5fa; cursor:pointer; display:flex; gap:9px; align-items:center; font-size:13.5px;
  }
  .node-block > .nb-body{padding:6px 13px 13px; display:none}
  .node-block.open > .nb-body{display:block}
  .kv{font-size:13px; color:var(--muted); margin:6px 0}
  .ed-note{font-size:12.5px; color:var(--muted); background:#f2f6fa; border-radius:8px; padding:8px 11px; margin:8px 0}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:#12331f; color:#c9f0d8; padding:9px 18px; border-radius:20px; font-size:13.5px;
    z-index:99; box-shadow:0 4px 14px rgba(0,0,0,.35); opacity:0; transition:.25s; pointer-events:none;
  }
  .toast.show{opacity:1}
  #codes{
    position:fixed; inset:0; z-index:50; background:#eef2f7; display:none;
    flex-direction:column; color:var(--ink);
  }
  #codes.open{display:flex}
  .codes-tbl{border-collapse:collapse; width:100%; font-size:13.5px; margin-top:8px}
  .codes-tbl th,.codes-tbl td{border:1px solid #dfe7ee; padding:6px 8px; text-align:left; vertical-align:top}
  .codes-tbl th{background:#f0f6fc}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">❄️ Холодильник<span>Доктор</span></div>
    <nav>
      <button id="btnNew">🔧 Диагностика</button>
      <button id="btnRef">📖 Справочник</button>
      <button id="btnSafe">⚠️ Безопасность</button>
      <button id="btnTeach">🎓 Обучение</button>
      <button id="btnCodes">🔢 Коды</button>
      <button id="btnAbout">ℹ️ О боте</button>
    </nav>
  </header>
  <main id="chat"></main>
  <footer>
    <input id="input" type="text" placeholder="Опишите проблему: «не морозит», «течёт вода», «щёлкает»…" autocomplete="off">
    <button id="send" title="Отправить">➤</button>
  </footer>
  <div class="foot-note">Ассистент — вспомогательный инструмент специалиста.</div>
</div>

<!-- ============ РЕДАКТОР БАЗЫ ЗНАНИЙ ============ -->
<div id="editor">
  <div class="ed-head">
    <button class="ed-back" id="edBack">← К диалогу</button>
    <span class="title">🎓 Редактор базы знаний</span>
    <div class="ed-tabs">
      <button data-tab="causes">Причины</button>
      <button data-tab="flows">Сценарии</button>
      <button data-tab="results">Результаты</button>
      <button data-tab="data">Данные</button>
    </div>
  </div>
  <div class="ed-body"><div class="ed-wrap" id="edContent"></div></div>
</div>
<!-- ============ СПРАВОЧНИК КОДОВ ОШИБОК ============ -->
<div id="codes">
  <div class="ed-head">
    <button class="ed-back" id="codesBack">← К диалогу</button>
    <span class="title">🔢 Коды ошибок по брендам</span>
  </div>
  <div class="ed-body"><div class="ed-wrap">
    <div class="ed-toolbar">
      <input type="text" id="codeSearch" placeholder="Код (F5, E4, AL01) или слово (датчик, заслонка, бренд)…">
    </div>
    <div id="codesResults"></div>
  </div></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   ЗАВОДСКАЯ БАЗА ЗНАНИЙ
   lvl: 1 — простая работа, 2 — средняя, 3 — спецоборудование
   (вскрытие контура, станция, сварка, заправка)
============================================================ */
const BUILTIN = {

causes:{
power_issue:{
  t:"Неисправность питания: розетка, вилка, сетевой шнур", lvl:1,
  signs:["Свет в камерах не горит, индикации нет — холодильник «мёртвый»","Мультиметр показывает 220 В, но под нагрузкой розетка «проседает» — подгоревшие контакты не держат ток","После шевеления вилки или кабеля иногда «оживает»"],
  checks:["Проверьте розетку под нагрузкой: включите чайник — если не греется, контакты подгорели, хотя 220 В «показывает»","Осмотрите вилку и шнур: потемнения, заломы, оплавление","Подключите холодильник напрямую в розетку, без удлинителей и фильтров","Проверьте автомат в электрощитке"],
  fix:"Замена неисправной розетки или вилки — по электрической части. Повреждённый сетевой шнур перешивается.",
  warn:"Оплавленную вилку и почерневшую розетку не использовать — риск пожара."
},
wiring_break:{
  t:"Обрыв сетевой проводки или клеммы внутри холодильника", lvl:2,
  signs:["Розетка живая, вилка и шнур снаружи целые, но ни свет, ни индикация не работают","Часто после перевозки или перегиба шнура у входа в корпус"],
  checks:["Прозвонить шнур и клеммную колодку от вилки до ввода в корпус","Пошевелить шнур у вилки и у входа в корпус при вставленной вилке — не «оживёт» ли","Осмотреть клеммы на потемнение"],
  fix:"Восстановление или замена участка проводки, перезаделка клеммы."
},
psu:{
  t:"Блок питания модулей (отдельный или встроенный)", lvl:3,
  signs:["Холодильник полностью мёртв при исправной розетке и шнуре","220 В приходит на все модули, но лампочка на модуле инвертора при включении не мигает","В моделях с раздельной электроникой (сетевой фильтр, блок питания, инвертор, основной модуль) — редкая, но реальная неисправность"],
  checks:["Проверить приход 220 В на каждый модуль","Лампочка инвертора не мигает при включении — признак отсутствия питающих напряжений","Замер выходных напряжений блока питания по схеме модели","Учесть компоновку: блок питания бывает отдельной платой, встроенным в модуль инвертора или в основную плату; в старых моделях — отдельный трансформатор, иногда размещён отдельно, например у мотора","Пример: у Samsung серии RB блок питания стоит на модуле инвертора — отдельной платы нет, проверяется и меняется инвертор"],
  fix:"Ремонт или замена блока питания (или платы, в которую он встроен)."
},
mains_filter:{
  t:"Сетевой фильтр помех (плата на входе)", lvl:2,
  signs:["220 В в шнуре есть, а на модули после фильтра не приходит","Практически всегда — следствие сильного скачка или грозы: сам по себе фильтр ломается редко"],
  checks:["Прозвонить предохранитель и дорожки платы фильтра","Если предохранитель сгорел — обязательно искать причину дальше по цепи"],
  fix:"Замена предохранителя или ремонт платы фильтра с последующей проверкой всей цепи.",
  warn:"Выход из строя — редкость: не спешите с этим диагнозом, сначала перепроверьте шнур, клеммы и соединения."
},
demo_mode:{
  t:"Включён демо-режим (витринный режим)", lvl:1,
  signs:["На дисплее надпись DEMO или мигают все сегменты","Свет горит, дисплей работает, но холода нет","Часто включается после скачка напряжения или случайного нажатия кнопок"],
  checks:["Найдите на дисплее слово DEMO / «демо» / мигающие символы","Отключите демо-режим комбинацией кнопок из инструкции к модели"],
  fix:"Отключите демо-режим по инструкции. Если холодильник сам в него возвращается — вероятна неисправность модуля управления."
},
thermostat:{
  t:"Термостат (механический регулятор температуры)", lvl:2,
  signs:["Компрессор не запускается, хотя в камерах тепло — или наоборот, морозит без остановки","Поворот ручки регулятора ничего не меняет","Характерно для моделей с поворотной ручкой"],
  checks:["Классическая проверка: при вынутой вилке замкнуть провода термостата, вставить вилку на несколько секунд — если компрессор стартовал, термостат неисправен. Сразу отключить."],
  fix:"Замена термостата на аналог с той же температурной характеристикой.",
  warn:"Проверка перемычкой — работа под напряжением: только с соблюдением мер предосторожности."
},
temp_sensor:{
  t:"Датчик температуры (в электронных моделях)", lvl:2,
  signs:["Температура в камерах не соответствует настройке","Компрессор не включается или не выключается","На дисплее может появляться код ошибки датчика"],
  checks:["В холодильнике 1–3 датчика: в камере, на испарителе, окружающего воздуха","Мультиметром замеряют сопротивление датчика и сверяют с таблицей для модели","Код ошибки на дисплее заметно ускоряет поиск"],
  fix:"Замена датчика: деталь недорогая, меняется по разборке конкретной модели."
},
control_board:{

results:{
R_click:{t:"Компрессор пытается запуститься и отключается защитой", intro:"По этой картинке причина в цепи пуска компрессора. Начинайте с простого и дешёвого.", causes:[
  {id:"start_relay", ch:"high", note:"Самая частая и самая дешёвая причина. Начните с неё."},
  {id:"low_voltage", ch:"low"},
  {id:"compressor_seized", ch:"mid", note:"Если новое реле не помогло и обмотки в норме — вероятно, клин."},
  {id:"compressor_windings", ch:"low"}
]},
R_power:{t:"Холодильник не получает питание", intro:"Свет не горит и признаков жизни нет — сначала цепь питания, а уже потом техника.", causes:[
  {id:"power_issue", ch:"high"}
]},
R_no_power_internal:{t:"Питание не доходит внутрь холодильника", intro:"Розетка живая, а мёртво всё, включая свет с исправной лампочкой, — значит, обрыв между вилкой и схемой.", causes:[
  {id:"power_issue", ch:"high", note:"Осмотрите шнур по всей длине и попробуйте пошевелить его у вилки и у входа в корпус при вставленной вилке."},
  {id:"wiring_break", ch:"mid"},
  {id:"control_board", ch:"low", note:"В некоторых моделях свет и мотор коммутируются платой — обрыв может быть на модуле."}
]},
R_psu_dead:{t:"Неисправен блок питания модулей", intro:"220 В на модулях есть, а индикация инвертора при включении не мигает — электроника обесточена. Редкий, но реальный случай.", causes:[
  {id:"psu", ch:"high", note:"Проверьте выходные напряжения блока питания по схеме. Помните про компоновку: блок бывает отдельным, встроенным в инвертор или в основную плату, а в старых моделях — отдельный трансформатор, порой у мотора."},
  {id:"mains_filter", ch:"low"},
  {id:"control_board", ch:"low", note:"Если напряжения в норме, а холодильник мёртв — смотрите основной модуль."}
]},
R_mains_filter:{t:"Не проходит дальше сетевого фильтра помех", intro:"Входное напряжение есть, а после платы фильтра — нет: обычно сгоревший предохранитель или дорожка. Сам фильтр ломается редко — как правило, это следствие скачка напряжения.", causes:[
  {id:"mains_filter", ch:"high", note:"Сгоревший предохранитель — симптом: найдите причину, прежде чем менять (проверьте блоки дальше по цепи)."},
  {id:"wiring_break", ch:"low", note:"Перепроверьте соединения на пути от шнура к плате фильтра."}
]},
R_electronics_dead:{t:"Электроника обесточена — нужны проверки модулей", intro:"Без прозвонки модулей однозначного вывода нет. Ниже — типовые кандидаты по убыванию вероятности.", causes:[
  {id:"psu", ch:"mid"},
  {id:"control_board", ch:"mid"},
  {id:"mains_filter", ch:"low", note:"Практически не выходит из строя без сильного скачка — проверяйте последним."}
]},
R_demo:{t:"Активен демо-режим", intro:"Хорошая новость: это, скорее всего, не поломка.", causes:[
  {id:"demo_mode", ch:"high"}
]},
R_error_code:{t:"Электроника сообщает об ошибке", intro:"Код ошибки сам указывает на узел — это упрощает диагностику.", causes:[
  {id:"error_code", ch:"high"}
]},
R_control_no_start:{t:"Питание есть, но команда на пуск не формируется", intro:"Свет и дисплей работают, реле не щёлкает — значит, компрессору не «приказывают» включаться.", causes:[
  {id:"temp_sensor", ch:"mid"},
  {id:"control_board", ch:"mid"},
  {id:"thermostat", ch:"low"}
]},
R_blinking_module:{t:"Свет мигает, мотор не запускается — неисправна электроника", intro:"Рабочий кейс (Schaub Lorenz, 3 года): мигающий свет при мёртвом моторе — почерк неисправного модуля управления: питание схемы сбоит или уходит в защиту.", causes:[
  {id:"control_board", ch:"high", note:"Мигание света — признак нестабильного питания от платы: модуль в ремонт или замену."},
  {id:"psu", ch:"mid", note:"Если блок питания отдельный — проверьте его выходные напряжения: просадки дают мигание и отказ пуска."},
  {id:"mains_filter", ch:"low", note:"Редко: подгоревший контакт или предохранитель фильтра помех даёт дребезг питания."}
]},
R_thermostat_no_start:{t:"Цепь регулировки температуры не замыкается", intro:"Свет горит, дисплея нет, щелчков нет — классика неисправного термостата.", causes:[
  {id:"thermostat", ch:"high"},
  {id:"temp_sensor", ch:"low"},
  {id:"control_board", ch:"low"}
]},
R_evap_fan_dead:{t:"Вентилятор испарителя не работает", intro:"В No Frost холод доставляется воздухом — без вентилятора морозилка может морозить «сама по себе», а камера греется.", causes:[
  {id:"evap_fan", ch:"high"},
  {id:"defrost_heater", ch:"low", note:"Если крыльчатка скована льдом — сначала решайте вопрос с оттайкой."}
]},
R_fan_dead_deep:{t:"Вентилятор молчит даже при подмене исправным", intro:"Рабочий кейс (Haier No Frost, ~7 лет): новый вентилятор не заработал, модуль после проверки оказался исправным — виноват шлейф от основной платы к дисплею. Проверяйте цепи связи между платами, прежде чем менять или везти модуль в ремонт.", causes:[
  {id:"cable_loop", ch:"high", note:"Прозвоните шлейф и пошевелите его у петель двери при работе — плавающие симптомы выдают перегиб."},
  {id:"control_board", ch:"mid", note:"Обвинять модуль — только после проверки шлейфа и разъёмов."},
  {id:"evap_fan", ch:"low", note:"Убедитесь, что подменный вентилятор действительно подходит модели (по обратной связи и распиновке)."}
]},
R_damper:{t:"Воздух не проходит в холодильную камеру", intro:"Холод есть, вентилятор гонит, но в камеру не попадает — проблема в канале.", causes:[
  {id:"damper", ch:"high"},
  {id:"defrost_heater", ch:"low", note:"Обмерзший канал воздуховода — следствие умершей оттайки."},
  {id:"control_board", ch:"low"}
]},
R_airflow:{t:"Холод есть в морозилке, но не доходит до холодильной камеры", intro:"В No Frost это почти всегда вопрос доставки воздуха.", causes:[
  {id:"evap_fan", ch:"high"},
  {id:"damper", ch:"mid"},
  {id:"defrost_heater", ch:"low"}
]},
R_cap_hk:{t:"Холодильная камера не охлаждается (капельная система)", intro:"Морозилка работает, а «плачущий» испаритель камеры — нет. Это очень характерная картина.", causes:[
  {id:"freon_leak_partial", ch:"high", note:"Утечка именно в испарителе холодильной камеры — самая частая история в таких симптомах."},
  {id:"capillary_block", ch:"mid"},
  {id:"thermostat", ch:"low", note:"Актуально для двухкомпрессорных моделей — где у камеры свой термостат."}
]},
R_valve_dead:{t:"Клапан не получает команду или не срабатывает", intro:"Фреон остаётся в контуре морозилки — камера не холодит. Делим цепочку: управление → катушка → механика.", causes:[
  {id:"switch_valve", ch:"high", note:"Катушка в обрыве или клапан заклинил — самая частая история в таких схемах."},
  {id:"thermostat", ch:"mid", note:"В схемах с механическим термостатом камеры команду клапану даёт именно он (типично для Атлант)."},
  {id:"control_board", ch:"mid"},
  {id:"temp_sensor", ch:"low"}
]},
R_valve_circuit:{t:"Клапан переключается, но контур камеры не холодит", intro:"Управление живо — проблема в гидравлике контура за клапаном.", causes:[
  {id:"capillary_block", ch:"high", note:"Засор капилляра именно контура холодильной камеры — классика двухконтурных схем с клапаном."},
  {id:"freon_leak_partial", ch:"mid"},
  {id:"switch_valve", ch:"low", note:"Щелчок есть, но канал внутри клапана перекрыт механически."}
]},
R_valve_hk:{t:"Холодильная камера не холодит (система с клапаном)", intro:"В холодильниках с переключающим клапаном сначала делят проблему: управление клапаном или гидравлика контура. Если клапан не проверялся — начните с перезапуска: выключение из сети на 10 минут и включение; сразу после включения клапан должен щёлкнуть.", causes:[
  {id:"switch_valve", ch:"high"},
  {id:"capillary_block", ch:"mid"},
  {id:"freon_leak_partial", ch:"mid"},
  {id:"control_board", ch:"low"}
]},
R_valve_frz:{t:"Морозилка недомораживает: компрессор часть пусков пропускает", intro:"Рабочий кейс (Liebherr ~10 лет, бистабильный клапан): в определённые моменты напряжение с модуля на компрессор просаживалось до ~170 В — компрессор не мог стартовать. Когда стартовал, холод уходил в холодильную камеру: у неё приоритет, и морозилка недополучала.", causes:[
  {id:"control_board", ch:"high", note:"Замерьте напряжение, которое модуль выдаёт на компрессор: просадка при пуске (например, до 170 В) не даёт ему стартовать — модуль в ремонт или замену."},
  {id:"start_relay", ch:"mid", note:"На схемах с обычным пусковым реле похожую картину дают подгорающие контакты реле."},
  {id:"freon_leak_partial", ch:"low", note:"Если напряжение пуска в норме — переходите к гидравлике контура."}
]},
R_freezer_weak:{t:"Морозилка морозит слабо при нормальной холодильной камере", intro:"Приоритет обычно у холодильной камеры — морозилка недополучает холод первой. Ниже причины по убыванию вероятности.", causes:[
  {id:"freon_leak_partial", ch:"high", note:"Частичная утечка в испарителе морозилки — частая история с возрастом."},
  {id:"capillary_block", ch:"mid"},
  {id:"compressor_worn", ch:"mid", note:"Горячий компрессор, работающий почти без пауз, — признак потери производительности."},
  {id:"control_board", ch:"low", note:"Случай с клапаном (Liebherr): модуль занижает напряжение пуска — компрессор пропускает старты, а холод уходит в холодильную камеру (приоритет)."},
  {id:"defrost_heater", ch:"low", note:"В No Frost — начинающееся обмерзание испарителя."}
]},
R_partial_leak:{t:"Испаритель холодильной камеры работает не всей площадью", intro:"Лёд и «шуба» на части задней стенки — почерк нехватки хладагента.", causes:[
  {id:"freon_leak_partial", ch:"high"},
  {id:"capillary_block", ch:"mid"}
]},
R_dry_hk:{t:"«Плачущий» испаритель сухой — хладагент в него не доходит", intro:"Стенка не «плачет» вовсе — фреон не доходит до плачки: контур холодильной камеры пуст или перекрыт.", causes:[
  {id:"freon_leak_full", ch:"high", note:"Полная утечка в контуре/испарителе холодильной камеры."},
  {id:"capillary_block", ch:"high", note:"Проверяется проколкой с манометром: на R134a разрежение −0,3 при работающем компрессоре — засор; на R600a ниже −0,4 (−0,3 для R600a — почти норма). Быстрый выход — долив до +0,5 бар (не по правилам): газ начнёт поступать в испаритель; правильное решение — чистка/замена капилляра."},
  {id:"freon_leak_partial", ch:"low", note:"Начальная стадия: стенка может подсыхать между циклами."}
]},
R_no_cold_cap:{t:"Контур циркуляции хладагента не работает", intro:"Компрессор жив, но холода нет совсем — причина в контуре.", causes:[
  {id:"freon_leak_full", ch:"high"},
  {id:"capillary_block", ch:"mid"},
  {id:"filter_drier", ch:"low"},
  {id:"compressor_worn", ch:"low"}
]},
R_defrost_nofrost:{t:"Отказ системы оттайки No Frost — испаритель во льду", intro:"Лёд блокирует и испаритель, и вентилятор: холод перестаёт доходить до камер. После полной разморозки на время помогает — потом повторяется. Проверяйте все элементы по очереди и до конца: двойные неисправности (таймер + дефростер одновременно) — не редкость.", causes:[
  {id:"defrost_heater", ch:"high"},
  {id:"defrost_sensor", ch:"mid"},
  {id:"defrost_timer", ch:"low"},
  {id:"evap_fan", ch:"low", note:"Вентилятор часто оказывается «второй жертвой» льда: проверьте его после оттайки."}
]},
R_defrost_element:{t:"Обрыв в силовой части оттайки: ТЭН или плавкий предохранитель", intro:"Цепь нагрева разорвана — оттайка не включается вовсе, шуба растёт.", causes:[
  {id:"defrost_heater", ch:"high"},
  {id:"defrost_sensor", ch:"mid", note:"Плавкий предохранитель прозванивается всегда, вне температуры: не звонится — менять (вместе с выяснением причины перегорания)."}
]},
R_timer_dead:{t:"Неисправен таймер оттайки", intro:"Механический таймер с проверочным проводом должен тикать и крутить вал. Молчит — в замену. Для механики возрастом 20–30 лет это ожидаемо.", causes:[
  {id:"defrost_timer", ch:"high", note:"Проверочный провод подключён, а таймер не тикает — вердикт однозначный."},
  {id:"defrost_sensor", ch:"low", note:"Дойдите до конца цепи: вместе с таймером нередко умирает и дефростер — случай двойной неисправности."}
]},
R_defroster_dead:{t:"Неисправен дефростер (датчик оттайки)", intro:"На холодном испарителе дефростер должен прозваниваться (быть замкнут). Обрыв или капли влаги в пакетике — в замену.", causes:[
  {id:"defrost_sensor", ch:"high", note:"Тест пакетиком: погреть и потрясти — капли внутри значат, что датчик негерметичен и набрал воду. Такой работает через раз: симптомы приходят и уходят («сам заработал»)."},
  {id:"defrost_timer", ch:"low", note:"Проверьте и таймер: двойные неисправности оттайки встречаются регулярно."}
]},
R_weak_cooling:{t:"Холод слабее нормы", intro:"Слабый холод — «размытый» симптом. Ниже — причины по убыванию вероятности с учётом простоты проверки.", causes:[
  {id:"freon_leak_partial", ch:"mid"},
  {id:"dirty_condenser", ch:"mid", note:"Проверьте первым — бесплатно."},
  {id:"door_seal", ch:"mid"},
  {id:"tough_conditions", ch:"low"},
  {id:"compressor_worn", ch:"low"}
]},
R_comp_noise:{t:"Шум из ниши компрессора", intro:"Определите характер: вибрация и касания лечатся на месте, внутренний стук — к замене компрессора.", causes:[
  {id:"compressor_noise", ch:"high"},
  {id:"rattle", ch:"mid"},
  {id:"normal_sounds", ch:"low", note:"Сравните: умеренный ровный гул — норма."}
]},
R_fan_noise:{t:"Шум внутри морозилки", intro:"Скрежет и натужный шелест в No Frost — почти всегда лёд или вентилятор.", causes:[
  {id:"defrost_heater", ch:"high", note:"Задевание крыльчаткой льда — следствие умершей оттайки. Снимите панель и посмотрите."},
  {id:"evap_fan", ch:"mid", note:"Износ подшипника или разбитая крыльчатка."}
]},
R_rattle:{t:"Дребезжание корпуса", intro:"Резонансы и касания — самая безобидная категория шума.", causes:[
  {id:"rattle", ch:"high"},
  {id:"compressor_noise", ch:"low"}

/* ================== Загрузка / сохранение базы ================== */
const LS_KEY = "fridgeDoctorKB_v1";
let KB = null;
function builtinClone(){ return JSON.parse(JSON.stringify(BUILTIN)); }
function loadKB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.causes && d.flows && d.results){
        KB = {causes:d.causes, flows:d.flows, results:d.results};
        return true;
      }
    }
  }catch(e){}
  KB = builtinClone();
  return false;
}
function saveKB(silent){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({v:1, causes:KB.causes, flows:KB.flows, results:KB.results}));
    if(!silent) toast("Сохранено ✓");
  }catch(e){ toast("Ошибка сохранения: " + e.message); }
}
loadKB();

function codeNorm(s){
  return String(s).toLowerCase()
    .replace(/е/g,"e").replace(/о/g,"o").replace(/с/g,"c").replace(/а/g,"a").replace(/р/g,"p")
    .replace(/[^a-z0-9]/g,"");
}

/* индекс кодов для поиска в сообщениях */
const codeIndex = {};
(function(){
  Object.keys(ERROR_CODES).forEach(function(brand){
    ERROR_CODES[brand].codes.forEach(function(pair){
      const k = codeNorm(pair[0]);
      if(!k) return;
      if(!codeIndex[k]) codeIndex[k] = [];
      codeIndex[k].push({brand:brand, code:pair[0], desc:pair[1]});
    });
  });
})();

function findCodesInText(t){
  const low = t.toLowerCase().replace(/[еосар]/g, function(ch){
    return {"е":"e","о":"o","с":"c","а":"a","р":"p"}[ch];
  });
  const words = low.split(/[^a-z0-9]+/);
  const found = [];
  words.forEach(function(w){
    if(!/[a-z]/.test(w)) return;
    if(codeIndex[w]) codeIndex[w].forEach(function(m){ found.push(m); });
  });
  return found;
}

function showCodeMatches(matches, rawText){
  const wrap = el("<div></div>");
  wrap.appendChild(el('<div class="res-intro"><strong>🔢 В сообщении найден код ошибки</strong><br>Расшифровка по справочнику:</div>'));
  matches.slice(0,8).forEach(function(m){
    const c = el('<div class="ed-item"></div>');
    c.innerHTML = '<span class="name" style="font-weight:600">'+esc(m.code)+" — "+esc(m.desc)+'</span><span class="idm">'+esc(m.brand)+"</span>";
    wrap.appendChild(c);
  });
  const chips = el('<div class="chips"></div>');
  const b = el('<button class="chip small">🔢 Открыть справочник кодов</button>');
  b.onclick = function(){ disableChips(chips); openCodes(rawText); };
  chips.appendChild(b);

  botSay(wrap, null, 450);
}

function openCodes(query){
  document.getElementById("codes").classList.add("open");
  const s = document.getElementById("codeSearch");
  s.value = query || "";
  renderCodes();
  try{ s.focus(); }catch(e){}
}

function renderCodes(){
  const box = document.getElementById("codesResults");
  const raw = document.getElementById("codeSearch").value.trim().toLowerCase();
  const q = codeNorm(raw);
  box.innerHTML = "";
  let shown = 0;
  Object.keys(ERROR_CODES).forEach(function(brand){
    const b = ERROR_CODES[brand];
    const matched = b.codes.filter(function(pair){
      if(!q) return true;
      if(codeNorm(pair[0]).indexOf(q) !== -1) return true;
      if(raw.length >= 3 && pair[1].toLowerCase().indexOf(raw) !== -1) return true;
      if(raw.length >= 3 && brand.toLowerCase().indexOf(raw) !== -1) return true;
      return false;
    });
    if(!matched.length) return;
    const card = el('<div class="ed-card"></div>');
    let html = "<strong>"+esc(brand)+"</strong>";
    b.notes.forEach(function(n){ html += '<div class="ed-note">'+esc(n)+"</div>"; });
    html += '<table class="codes-tbl"><tr><th>Код</th><th>Значение</th></tr>';
    matched.forEach(function(p){ html += "<tr><td><b>"+esc(p[0])+"</b></td><td>"+esc(p[1])+"</td></tr>"; });
    html += "</table>";
    card.innerHTML = html;
    box.appendChild(card);
    shown++;
  });
  if(!shown) box.appendChild(el('<div class="ed-note">Ничего не найдено. Попробуйте код (F5, E4, AL01) или слово (датчик, заслонка, бренд).</div>'));
}

function botSay(html, cb, delay){
  const row = el('<div class="row"><div class="ava">🔧</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>');
  chat.appendChild(row); scrollDown();

    else row.querySelector(".bubble").appendChild(html);

  }, delay || 550);
}

/* вопрос узла */
function askNode(nodeId){
  const flow = KB.flows[state.flowId];
  const node = flow && flow.nodes[nodeId];
  if(!node){ botSay("⚠️ Узел «"+esc(nodeId)+"» не найден в сценарии — проверьте его в редакторе базы знаний."); return; }
  state.nodeId = nodeId;
  const html = el("<div></div>");
  html.appendChild(el('<div class="q">'+esc(node.q)+"</div>"));
  if(node.hint) html.appendChild(el('<div class="hint">💡 '+esc(node.hint)+"</div>"));
  const chips = el('<div class="chips"></div>');
  node.opts.forEach(function(opt){
    const b = el('<button class="chip">'+esc(opt.t)+"</button>");
    b.onclick = function(){ choose(opt, chips); };
    chips.appendChild(b);
  });
  html.appendChild(chips);
  botSay(html);
}

function choose(opt, chips){
  disableChips(chips);
  addUser(opt.t);
  if(opt.set) Object.assign(state.vars, opt.set);
  const node = KB.flows[state.flowId].nodes[state.nodeId];
  if(opt.a) state.answers.push([node ? node.q : "", opt.a]);
  if(opt.res){ showResult(opt.res); return; }
  if(opt.goto){
    state.flowId = opt.goto;
    askNode("start");
    return;
  }
  let nextId = opt.next;
  if(opt.branch){
    const v = state.vars[opt.branch.by];
    nextId = opt.branch.map[v] || opt.branch.map.unknown;
  }
  if(nextId && KB.results[nextId]){ showResult(nextId); return; }
  if(nextId) askNode(nextId);
  else showResult("R_other");
}

function causeCard(ref){
  const c = KB.causes[ref.id];
  if(!c) return el("<div></div>");
  const d = el('<details class="cause"></details>');
  let head = "<summary>"+chanceBadge(ref.ch)+" "+esc(c.t);
  head += " "+lvlBadge(c.lvl);
  head += '<span class="arr">▼</span></summary>';
  let body = '<div class="body">';
  if(c.signs && c.signs.length){
    body += "<h4>Типичные признаки</h4><ul>";
    c.signs.forEach(function(s){ body += "<li>"+esc(s)+"</li>"; });
    body += "</ul>";
  }
  if(c.checks && c.checks.length){
    body += "<h4>Как проверить</h4><ol>";
    c.checks.forEach(function(s){ body += "<li>"+esc(s)+"</li>"; });
    body += "</ol>";
  }
  if(c.fix) body += "<h4>Устранение</h4><p>"+esc(c.fix)+"</p>";
  if(ref.note) body += '<div class="note">💬 '+esc(ref.note)+"</div>";
  if(c.warn) body += '<div class="warnbox">⚠️ '+esc(c.warn)+"</div>";
  body += '<div class="chips"><button class="chip small">✏️ Дополнить в редакторе</button></div>';
  body += "</div>";
  d.innerHTML = head + body;
  d.querySelector(".chip").onclick = function(){ openEditor("causes", {causeId:ref.id}); };
  return d;
}

  if(!r){ botSay("⚠️ Результат «"+esc(resId)+"» не найден — проверьте базу знаний в редакторе."); return; }
  const wrap = el("<div></div>");
  wrap.appendChild(el('<div class="res-intro"><strong>🔎 '+esc(r.t)+"</strong><br>"+esc(r.intro||"")+"</div>"));
  if(state.vars.compressor === "2" && (resId === "R_cap_hk" || resId === "R_dry_hk" || resId === "R_partial_leak")){
    wrap.appendChild(el('<div class="ed-note" style="margin-top:8px">ℹ️ По опросу холодильник двухкомпрессорный: проблема локализована в контуре холодильной камеры — проверяйте его испаритель, капилляр и собственный термостат/датчик отдельно от морозильного контура.</div>'));
  }
  (r.causes||[]).forEach(function(ref){ wrap.appendChild(causeCard(ref)); });
  const chips = el('<div class="chips"></div>');
  [
    ["📋 Карточка диагностики", function(){ showDiagCard(r); }],
    ["🔄 Начать заново", function(){ startNew(); }],
    ["📖 Справочник", function(){ showRef(); }]
  ].forEach(function(p){
    const b = el('<button class="chip small">'+p[0]+"</button>");

  });
  if(resId === "R_error_code"){

    cb2.onclick = function(){ openCodes(""); };

function showDiagCard(r){
  let txt = "КАРТОЧКА ДИАГНОСТИКИ\n\nСимптом: "+(state.symptom || r.t)+"\n\n";
  state.answers.forEach(function(pair){
    txt += "— " + pair[0] + "\n  Ответ: " + pair[1] + "\n";
  });
  txt += "\nПредварительные версии:\n";
  (r.causes||[]).forEach(function(c, i){
    const cc = KB.causes[c.id];
    txt += (i+1) + ". " + (cc ? cc.t : c.id) + "\n";
  });
  txt += "\nМодель: " + (state.vars.model || "______");

    copyText(txt);

    setTimeout(function(){ copyBtn.textContent = "📑 Скопировать текст"; }, 2000);
  };

}

function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).catch(function(){ legacyCopy(txt); });
  } else legacyCopy(txt);
}
function legacyCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* свободный текст */
function routeText(t){
  const low = t.toLowerCase();
  const ids = Object.keys(KB.flows);
  for(let i = 0; i < ids.length; i++){
    const f = KB.flows[ids[i]];
    const keys = f.keywords || [];
    for(let k = 0; k < keys.length; k++){
      if(low.indexOf(keys[k]) !== -1) return ids[i];
    }
  }
  return null;
}

function handleSend(){
  const t = input.value.trim();
  if(!t || state.busy) return;
  input.value = "";
  addUser(t);
  if(state.inputCb){
    const cb = state.inputCb;
    state.inputCb = null;
    cb(t);
    return;
  }
  const codeMatches = findCodesInText(t);
  if(codeMatches.length){ showCodeMatches(codeMatches, t); return; }
  const flowId = routeText(t);
  if(flowId){
    startFlow(flowId, null);
  } else {
    botSay("Не смог однозначно распознать проблему по описанию — давайте выберем из списка типовых симптомов.", null, 400);
    setTimeout(function(){ botSay(symptomMenu()); }, 700);
  }
}

function openEditor(tab, opts){
  ED.tab = tab;
  if(opts){
    if(opts.causeId !== undefined){ ED.openCauseForm = opts.causeId; }
    if(opts.flowId !== undefined) ED.flowId = opts.flowId;
    if(opts.resId !== undefined) ED.resId = opts.resId;
  }
  edEl.classList.add("open");
  document.querySelectorAll(".ed-tabs button").forEach(function(b){
    b.classList.toggle("active", b.dataset.tab === tab);
  });
  renderEditor();

function renderEditor(){
  if(ED.tab === "causes") renderCausesTab();

/* ---------- Причины ---------- */
function renderCausesTab(){
  const box = el("<div></div>");
  const toolbar = el('<div class="ed-toolbar"><input type="text" id="edSearch" placeholder="Поиск по названию…"><button class="btn green" id="edAddCause">+ Новая причина</button></div>');
  box.appendChild(toolbar);
  const list = el('<div id="edCauseList"></div>');
  box.appendChild(list);
  edContent.innerHTML = "";
  edContent.appendChild(box);

  toolbar.querySelector("#edAddCause").onclick = function(){ causeForm(null); };
  toolbar.querySelector("#edSearch").oninput = function(){
    ED.filter = this.value.toLowerCase();
    drawCauseList(list);
  };
  drawCauseList(list);
  if(ED.openCauseForm){
    causeForm(ED.openCauseForm);
    ED.openCauseForm = null;
  }
}

function drawCauseList(list){
  list.innerHTML = "";
  Object.keys(KB.causes).forEach(function(id){
    const c = KB.causes[id];
    if(ED.filter && c.t.toLowerCase().indexOf(ED.filter) === -1) return;
    const item = el('<div class="ed-item"></div>');
    item.innerHTML = '<span class="name">'+esc(c.t)+'</span> '+lvlBadge(c.lvl)+
      ' <span class="idm">'+esc(id)+"</span>";
    const be = el('<button class="btn small">Изменить</button>');
    be.onclick = function(){ causeForm(id); };
    const bd = el('<button class="btn small red">Удалить</button>');
    bd.onclick = function(){
      if(confirm("Удалить причину «"+c.t+"»? Ссылки в результатах останутся и будут подсвечены как недействующие.")){
        delete KB.causes[id]; saveKB(); drawCauseList(list);
      }
    };
    item.appendChild(be); item.appendChild(bd);
    list.appendChild(item);
  });
  if(!list.children.length) list.appendChild(el('<div class="ed-note">Ничего не найдено.</div>'));
}

function causeForm(id){
  const old = document.getElementById("edCauseForm");
  if(old) old.remove();
  const c = id ? KB.causes[id] : {t:"", lvl:2, signs:[], checks:[], fix:"", warn:""};
  const f = el('<div class="ed-card ed-form" id="edCauseForm"></div>');
  f.innerHTML =

      '<option value="1"'+(c.lvl===1?" selected":"")+'>🔧 Простая</option>'+
      '<option value="2"'+(c.lvl===2?" selected":"")+'>🔧🔧 Средняя</option>'+
      '<option value="3"'+(c.lvl===3?" selected":"")+'>⚙️ Спецоборудование</option>'+
    "</select>"+
    "<label>Типичные признаки (по одному в строке)</label><textarea id=cf_signs>"+esc((c.signs||[]).join("\n"))+"</textarea>"+
    "<label>Как проверить (по одному в строке)</label><textarea id=cf_checks>"+esc((c.checks||[]).join("\n"))+"</textarea>"+
    "<label>Устранение</label><textarea id=cf_fix>"+esc(c.fix||"")+"</textarea>"+
    "<label>Предупреждение (необязательно)</label><textarea id=cf_warn>"+esc(c.warn||"")+"</textarea>"+
    '<div class="ed-actions"><button class="btn green" id=cf_save>💾 Сохранить</button><button class="btn gray" id=cf_cancel>Отмена</button></div>';
  edContent.appendChild(f);

function nodeBlock(f, nid){
  const n = f.nodes[nid];
  const blk = el('<div class="node-block"></div>');
  const head = el('<div class="nb-head"><span style="font-weight:700">'+esc(nid)+"</span><span style='color:#5d7285'>"+esc(String(n.q||"").slice(0,80))+"</span></div>");
  head.onclick = function(){ blk.classList.toggle("open"); };
  blk.appendChild(head);
  const body = el('<div class="nb-body ed-form"></div>');
  body.innerHTML =
    "<label>Вопрос</label><textarea id=nb_q>"+esc(n.q||"")+"</textarea>"+
    "<label>Подсказка (необязательно)</label><textarea id=nb_h style='min-height:52px'>"+esc(n.hint||"")+"</textarea>"+
    '<label>Варианты ответа</label><div class="ed-note">Тип цели: «узел» — следующий вопрос этого сценария; «результат» — итог диагностики; «переход» — старт другого сценария; «ветвление» — разные узлы в зависимости от типа системы (для сценариев, где он определяется).</div>'+
    '<div id=nb_opts></div><button class="btn small" id=nb_addopt>+ Вариант</button>'+
    '<div class="ed-actions"><button class="btn green" id=nb_save>💾 Сохранить узел</button><button class="btn red" id=nb_del>Удалить узел</button></div>';
  const optsBox = body.querySelector("#nb_opts");
  const draft = JSON.parse(JSON.stringify(n.opts||[]));

  function curType(o){ return o.res ? "res" : o.goto ? "goto" : o.branch ? "branch" : "next"; }

  function drawOpts(){
    optsBox.innerHTML = "";
    draft.forEach(function(o, i){
      const row = el('<div class="opt-row"></div>');
      const it = el('<input type="text" class="otext" placeholder="Текст кнопки">');
      it.value = o.t || "";
      const ia = el('<input type="text" class="oans" placeholder="Ответ для карточки">');
      ia.value = o.a || "";
      it.oninput = function(){ o.t = it.value; };
      ia.oninput = function(){ o.a = ia.value; };
      row.appendChild(it); row.appendChild(ia);

      const tt = el("<select></select>");
      [["next","узел"],["res","результат"],["goto","переход"],["branch","ветвление"]].forEach(function(p){
        const op = el("<option></option>"); op.value = p[0]; op.textContent = p[1];
        tt.appendChild(op);
      });
      let cur = curType(o);
      tt.value = cur;
      row.appendChild(tt);

      const tv = el("<select></select>");
      function fillTv(type){
        tv.innerHTML = "";
        tv.disabled = false;
        if(type === "next"){
          Object.keys(f.nodes).forEach(function(k){
            const op = el("<option></option>"); op.value = k; op.textContent = k;
            tv.appendChild(op);
          });
          if(o.next && f.nodes[o.next]) tv.value = o.next;
          else if(tv.options.length) tv.value = tv.options[0].value;
        } else if(type === "res"){
          Object.keys(KB.results).forEach(function(k){
            const op = el("<option></option>"); op.value = k; op.textContent = k;
            tv.appendChild(op);
          });
          if(o.res && !KB.results[o.res]){
            const op = el("<option></option>"); op.value = o.res; op.textContent = o.res + " (нет)";
            tv.appendChild(op);
          }
          tv.value = o.res || "R_other";
        } else if(type === "goto"){
          Object.keys(KB.flows).forEach(function(k){
            const op = el("<option></option>"); op.value = k; op.textContent = k;
            tv.appendChild(op);
          });
          tv.value = o.goto || Object.keys(KB.flows)[0];
        } else {
          tv.disabled = true;
        }
      }
      fillTv(cur);

      const brBox = el('<div style="display:'+(cur==="branch"?"flex":"none")+';gap:6px;flex-wrap:wrap;align-items:center"></div>');
      ["nofrost","cap","unknown"].forEach(function(k){
        const wrap2 = el("<span></span>");
        const lab = el('<span style="font-size:11px;color:#5d7285">'+k+":</span> ");
        const s = el("<select></select>");
        Object.keys(f.nodes).forEach(function(kk){
          const op = el("<option></option>"); op.value = kk; op.textContent = kk;
          s.appendChild(op);
        });
        const cur2 = (o.branch && o.branch.map && o.branch.map[k]);
        if(cur2 && f.nodes[cur2]) s.value = cur2;
        else if(s.options.length) s.value = s.options[0].value;
        s.onchange = function(){
          o.branch = {by:"type", map:o.branch && o.branch.map ? o.branch.map : {}};
          o.branch.map[k] = s.value;
        };
        wrap2.appendChild(lab); wrap2.appendChild(s);
        brBox.appendChild(wrap2);
      });
      row.appendChild(brBox);

      function applyTarget(){
        const type = tt.value;
        delete o.next; delete o.res; delete o.goto; delete o.branch;
        if(type === "next") o.next = tv.value;
        else if(type === "res") o.res = tv.value;
        else if(type === "goto") o.goto = tv.value;
        else { o.branch = {by:"type", map:{}}; }
      }
      tt.onchange = function(){
        applyTarget();
        fillTv(tt.value);
        brBox.style.display = tt.value === "branch" ? "flex" : "none";
      };
      tv.onchange = function(){ applyTarget(); };
      row.appendChild(tt); row.appendChild(tv); row.appendChild(brBox);

      const bx = el('<button class="btn small red">✕</button>');
      bx.onclick = function(){ draft.splice(i,1); drawOpts(); };
      row.appendChild(bx);
      optsBox.appendChild(row);
    });
  }
  drawOpts();

  body.querySelector("#nb_addopt").onclick = function(){
    draft.push({t:"Новый вариант", a:"Ответ", res:"R_other"});
    drawOpts();
  };
  body.querySelector("#nb_save").onclick = function(){
    n.q = body.querySelector("#nb_q").value.trim();
    n.hint = body.querySelector("#nb_h").value.trim();
    n.opts = draft.filter(function(o){ return o.t && o.t.trim().length; });
    saveKB();
    renderEditor();
  };
  body.querySelector("#nb_del").onclick = function(){
    if(confirm("Удалить узел «"+nid+"»? Проверьте, что на него нет ссылок из других узлов.")){
      delete f.nodes[nid]; saveKB(); renderEditor();
    }
  };

  blk.appendChild(body);
  return blk;
}

/* ---------- Результаты ---------- */
function renderResultsTab(){
  if(!ED.resId || !KB.results[ED.resId]) ED.resId = Object.keys(KB.results)[0] || null;
  const box = el("<div></div>");
  const toolbar = el('<div class="ed-toolbar"><select id="edResSel" style="flex:1;min-width:220px;border:1px solid #c9d6e2;border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit"></select>'+
    '<button class="btn green" id="edAddRes">+ Новый результат</button></div>');
  box.appendChild(toolbar);
  const sel = toolbar.querySelector("#edResSel");
  Object.keys(KB.results).forEach(function(rid){
    const o = el("<option></option>");
    o.value = rid; o.textContent = KB.results[rid].t + " (" + rid + ")";
    if(rid === ED.resId) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function(){ ED.resId = this.value; renderEditor(); };
  toolbar.querySelector("#edAddRes").onclick = function(){
    const rid = newId("R");
    KB.results[rid] = {t:"Новый результат", intro:"", causes:[]};
    ED.resId = rid; saveKB(); renderEditor();
  };

  const r = KB.results[ED.resId];
  if(r){
    const card = el('<div class="ed-card ed-form"></div>');
    card.innerHTML =
      "<strong>Результат</strong>"+
      "<label>Заголовок</label><input type=text id=rf_t value=\""+esc(r.t)+"\">"+
      "<label>Пояснение</label><textarea id=rf_i>"+esc(r.intro||"")+"</textarea>"+
      "<label>Причины (порядок = приоритет)</label><div id=rf_causes></div>"+
      '<button class="btn small" id=rf_add>+ Причина</button>'+
      '<div class="ed-actions"><button class="btn green" id=rf_save>💾 Сохранить</button><button class="btn red" id=rf_del>Удалить результат</button></div>';
    const cbox = card.querySelector("#rf_causes");
    function drawCauses(){
      cbox.innerHTML = "";
      (r.causes||[]).forEach(function(ref, i){
        const row = el('<div class="opt-row"></div>');
        const sc = el('<select style="flex:2;min-width:220px"></select>');
        Object.keys(KB.causes).forEach(function(cid){
          const o = el("<option></option>");
          o.value = cid; o.textContent = KB.causes[cid].t;
          sc.appendChild(o);
        });
        if(ref.id && !KB.causes[ref.id]){
          const o = el("<option></option>");
          o.value = ref.id; o.textContent = ref.id + " (причина удалена)";
          sc.appendChild(o);
        }
        sc.value = ref.id && KB.causes[ref.id] ? ref.id : Object.keys(KB.causes)[0];
        sc.onchange = function(){ ref.id = sc.value; };
        const sh = el('<select style="flex:1;min-width:130px"></select>');
        [["high","Очень вероятно"],["mid","Вероятно"],["low","Возможно"]].forEach(function(p){
          const o = el("<option></option>"); o.value = p[0]; o.textContent = p[1];
          sh.appendChild(o);
        });
        sh.value = ref.ch || "low";
        sh.onchange = function(){ ref.ch = sh.value; };
        const sn = el('<input type="text" placeholder="Комментарий (необязательно)" style="flex:2;min-width:200px">');
        sn.value = ref.note || "";
        sn.oninput = function(){ ref.note = sn.value; };
        const bx = el('<button class="btn small red">✕</button>');
        bx.onclick = function(){ r.causes.splice(i,1); drawCauses(); };
        row.appendChild(sc); row.appendChild(sh); row.appendChild(sn); row.appendChild(bx);
        cbox.appendChild(row);
      });
    }
    drawCauses();
    card.querySelector("#rf_add").onclick = function(){
      r.causes = r.causes || [];
      r.causes.push({id:Object.keys(KB.causes)[0], ch:"low"});
      drawCauses();
    };
    card.querySelector("#rf_save").onclick = function(){
      r.t = card.querySelector("#rf_t").value.trim() || r.t;
      r.intro = card.querySelector("#rf_i").value.trim();
      saveKB(); renderEditor();
    };
    card.querySelector("#rf_del").onclick = function(){
      if(confirm("Удалить результат «"+r.t+"»? Ссылки из сценариев станут недействующими.")){
        delete KB.results[ED.resId];
        ED.resId = Object.keys(KB.results)[0];
        saveKB(); renderEditor();
      }
    };
    box.appendChild(card);
  }
  edContent.innerHTML = "";
  edContent.appendChild(box);
}

/* ---------- Данные ---------- */
function renderDataTab(){
  const box = el("<div></div>");
  const card = el('<div class="ed-card"></div>');
  const nC = Object.keys(KB.causes).length;
  const nF = Object.keys(KB.flows).length;
  const nR = Object.keys(KB.results).length;
  card.innerHTML =
    "<strong>Данные базы знаний</strong>"+
    '<div class="kv">Причин: <b>'+nC+"</b> · Сценариев: <b>"+nF+"</b> · Результатов: <b>"+nR+"</b></div>"+
    '<div class="ed-note">Все правки автоматически сохраняются в этом браузере и сразу применяются в диалоге. Перенос на другой компьютер или обмен с коллегами — через экспорт/импорт файла.</div>'+
    '<div class="ed-actions">'+
      '<button class="btn" id="dd_export">⬇ Экспорт в файл</button>'+
      '<button class="btn gray" id="dd_import">⬆ Импорт из файла</button>'+
      '<button class="btn red" id="dd_reset">↺ Сбросить к заводской</button>'+
    '</div>'+
    '<input type="file" id="dd_file" accept=".json,application/json" style="display:none">';
  box.appendChild(card);
  edContent.innerHTML = "";
  edContent.appendChild(box);

  card.querySelector("#dd_export").onclick = function(){
    const blob = new Blob([JSON.stringify({v:1, causes:KB.causes, flows:KB.flows, results:KB.results}, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "fridge-doctor-kb.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  card.querySelector("#dd_import").onclick = function(){ card.querySelector("#dd_file").click(); };
  card.querySelector("#dd_file").onchange = function(){
    const file = this.files[0];
    if(!file) return;
    const rd = new FileReader();
    rd.onload = function(){
      try{
        const d = JSON.parse(rd.result);
        if(!d || !d.causes || !d.flows || !d.results) throw new Error("структура не совпадает");
        KB = {causes:d.causes, flows:d.flows, results:d.results};
        saveKB(true);
        toast("База импортирована ✓");
        ED.flowId = null; ED.resId = null;
        renderEditor();
      }catch(e){ toast("Импорт не удался: " + e.message); }
    };
    rd.readAsText(file, "utf-8");
  };
  card.querySelector("#dd_reset").onclick = function(){
    if(confirm("Сбросить все правки и вернуть заводскую базу знаний?")){
      localStorage.removeItem(LS_KEY);
      KB = builtinClone();
      ED.flowId = null; ED.resId = null;
      toast("Заводская база восстановлена");
      renderEditor();
    }
  };
}
